  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <span class="brand-mark" data-icon="spark" aria-hidden="true"></span>
        <span class="brand-text">
          <strong>人格工坊</strong>
          <small>Persona Forge</small>
        </span>
      </div>

      <nav class="nav" id="nav" aria-label="视图切换">
        <button class="nav-item" type="button" data-route="personas">
          <span class="nav-icon" data-icon="users" aria-hidden="true"></span>
          <span class="nav-label">人格</span>
          <span class="nav-count" data-count="personas" hidden></span>
        </button>
        <button class="nav-item" type="button" data-route="reviews">
          <span class="nav-icon" data-icon="review" aria-hidden="true"></span>
          <span class="nav-label">审查</span>
          <span class="nav-count" data-count="reviews" hidden></span>
        </button>
        <button class="nav-item" type="button" data-route="life">
          <span class="nav-icon" data-icon="heart" aria-hidden="true"></span>
          <span class="nav-label">生命卡</span>
          <span class="nav-count" data-count="life" hidden></span>
        </button>
      </nav>

      <div class="sidebar-note" id="sidebar-note" hidden></div>

      <div class="sidebar-foot">
        <button class="nav-item nav-settings" type="button" data-route="settings">
          <span class="nav-icon" data-icon="gear" aria-hidden="true"></span>
          <span class="nav-label">设置中心</span>
        </button>
        <div class="foot-row">
          <span class="version" id="version-label">v—</span>
          <span class="foot-dot" id="conn-dot" title="连接状态"></span>
        </div>
      </div>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" data-icon="menu" aria-label="打开导航" aria-expanded="false"></button>

        <div class="search" role="search">
          <span class="search-icon" data-icon="search" aria-hidden="true"></span>
          <input id="search-input" class="search-input" type="search" placeholder="搜索人格、审查或生命卡…"
                 autocomplete="off" spellcheck="false" aria-label="搜索" />
          <button class="search-clear" id="search-clear" type="button" data-icon="x" aria-label="清除搜索" hidden></button>
        </div>

        <div class="topbar-actions">
          <button class="persona-pill" id="active-pill" type="button" aria-label="当前人格">
            <span class="pill-avatar" id="pill-avatar" aria-hidden="true"></span>
            <span class="pill-text">
              <span class="pill-label">当前人格</span>
              <span class="pill-name" id="pill-name">未选择</span>
            </span>
          </button>
          <button class="btn btn-primary btn-iterate" id="iterate-btn" type="button" aria-label="提炼当前人格">
            <span class="btn-icon" data-icon="wand" aria-hidden="true"></span>
            <span class="btn-label">提炼当前人格</span>
          </button>
          <button class="icon-btn" id="refresh-btn" type="button" data-icon="refresh" aria-label="刷新当前页" title="刷新当前页"></button>
          <button class="icon-btn" id="theme-btn" type="button" data-icon="moon" aria-label="切换深色主题" title="切换深色主题"></button>
        </div>
      </header>

      <div class="banner" id="banner" role="status" aria-live="polite" hidden>
        <span class="banner-icon" data-icon="alert" aria-hidden="true"></span>
        <span class="banner-text" id="banner-text"></span>
        <button class="icon-btn banner-close" id="banner-close" type="button" data-icon="x" aria-label="关闭提示"></button>
      </div>

      <main class="view-root" id="view-root" tabindex="-1">
        <div class="boot" id="boot">
          <span class="spinner" aria-hidden="true"></span>
          <p>正在连接人格工坊…</p>
        </div>
      </main>
    </div>
  </div>

  <div class="scrim" id="drawer-scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer-head" id="drawer-head"></div>
    <div class="drawer-tabs" id="drawer-tabs" role="tablist" aria-label="人格详情分区"></div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="modal-root" id="modal-root" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <template id="tpl-persona-card">
    <article class="persona-card" tabindex="0" role="button">
      <div class="card-avatar">
        <img class="avatar-img" alt="" hidden />
        <span class="avatar-fallback" aria-hidden="true"></span>
        <span class="card-active-dot" title="当前人格" hidden></span>
      </div>
      <div class="card-main">
        <h3 class="card-name"></h3>
        <div class="card-id"></div>
        <div class="card-badges"></div>
        <div class="card-meta"></div>
      </div>
      <div class="card-foot"></div>
    </article>
  </template>

  <template id="tpl-skeleton-card">
    <div class="skeleton-card" aria-hidden="true">
      <div class="sk sk-avatar"></div>
      <div class="sk-lines">
        <div class="sk sk-line" style="width:62%"></div>
        <div class="sk sk-line" style="width:38%"></div>
        <div class="sk sk-line" style="width:82%"></div>
      </div>
    </div>
  </template>

  <template id="tpl-empty">
    <div class="empty">
      <span class="empty-icon" aria-hidden="true"></span>
      <h3 class="empty-title"></h3>
      <p class="empty-hint"></p>
      <div class="empty-actions"></div>
    </div>
  </template>

  <template id="tpl-field">
    <div class="field">
      <div class="field-head">
        <label class="field-label"></label>
        <span class="field-badge" hidden></span>
      </div>
      <div class="field-control"></div>
      <p class="field-hint" hidden></p>
    </div>
  </template>

  <template id="tpl-badge">
    <span class="badge"></span>
  </template>

  <template id="tpl-diff-line">
    <div class="diff-line">
      <span class="diff-no"></span>
      <span class="diff-no"></span>
      <span class="diff-sign"></span>
      <span class="diff-text"></span>
    </div>
  </template>

  <noscript>
    <p class="noscript">人格工坊需要启用 JavaScript 才能使用。</p>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
